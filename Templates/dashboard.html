{% extends "base.html" %}
{% block content %}
{% load static %}

<div class="dashboard-logo">
    <img src="{% static 'images/logo.png' %}" alt="Earth Logo">
</div>

<div class="card">
    <h2>Speech Translation Workspace</h2>
    <p style="color:#9ca3af;">
        Convert text or audio into any supported language.
    </p>

    <form id="processForm">

        <!-- ========================= -->
        <!-- INPUT MODE -->
        <!-- ========================= -->
        <label>Input Mode</label>
        
        <select id="mode" name="mode">
            <option value="text">Text Translation</option>
            <option value="audio">Audio Upload</option>
            <option value="realtime">Live Microphone Translation</option>
        </select>
        <!-- ========================= -->
        <!-- SOURCE LANGUAGE -->
        <!-- ========================= -->
        <label>Source Language</label>
        <select id="sourceLang" name="source_lang">
            <option value="en">English</option>
            <option value="ur">Urdu</option>
        </select>

        <!-- ========================= -->
        <!-- TARGET LANGUAGE -->
        <!-- ========================= -->
        <label>Target Language</label>
        <select id="targetLang" name="target_lang"></select>

        <!-- ========================= -->
        <!-- TEXT SECTION -->
        <!-- ========================= -->
        <div id="textSection">
            <label>Enter Text</label>
            <textarea id="textInput" name="text" rows="4"
                placeholder="Type your text here..."></textarea>
        </div>

        <!-- ========================= -->
        <!-- AUDIO SECTION -->
        <!-- ========================= -->
        <div id="audioSection" style="display:none;">
            <label>Upload Audio</label>
            <input type="file" id="audioInput" name="audio" accept="audio/*">
        </div>

        <button type="submit" id="submitBtn">Translate</button>
        <div id="realtimeSection" style="display:none;">

            <label>Live Translation</label>

            <button type="button" id="startMic">Start Recording</button>
            <button type="button" id="stopMic">Stop Recording</button>

            <p id="liveStatus">Microphone Idle</p>

        </div>
    </form>
</div>

<!-- ========================= -->
<!-- RESULT SECTION -->
<!-- ========================= -->
<div class="card" id="resultSection" style="display:none;">
    <h3>Result</h3>
    <div id="translatedText"></div>
    <div id="audioContainer"></div>
</div>

<script>


function getCSRFToken() {
    return document.cookie
        .split("; ")
        .find(row => row.startsWith("csrftoken="))
        ?.split("=")[1];
}




// ==========================================
// LANGUAGE CONFIGURATION
// ==========================================

const targetLanguages = {
    en: "English",
    ur: "Urdu",
    ps: "Pashto",
    fa: "Dari (Persian - Afghanistan)",
    fr: "French",
    de: "German",
    es: "Spanish",
    it: "Italian",
    ar: "Arabic",
    "zh-CN": "Chinese (Simplified)",
    "zh-TW": "Chinese (Traditional)",
    hi: "Hindi",
    tr: "Turkish",
    ko: "Korean",
    pt: "Portuguese",
    bn: "Bengali",
};

// ==========================================
// UI ELEMENTS
// ==========================================

const form = document.getElementById("processForm");
const submitBtn = document.getElementById("submitBtn");
const resultSection = document.getElementById("resultSection");
const translatedText = document.getElementById("translatedText");
const audioContainer = document.getElementById("audioContainer");
const audioInput = document.getElementById("audioInput");

const modeSelect = document.getElementById("mode");
const sourceSelect = document.getElementById("sourceLang");
const targetSelect = document.getElementById("targetLang");
const textSection = document.getElementById("textSection");
const audioSection = document.getElementById("audioSection");

// ==========================================
// POPULATE TARGET LANGUAGES
// ==========================================

function populateTargetLanguages() {
    const sourceLang = sourceSelect.value;

    targetSelect.innerHTML = "";

    for (let code in targetLanguages) {
        if (code !== sourceLang) {
            const option = document.createElement("option");
            option.value = code;
            option.textContent = targetLanguages[code];
            targetSelect.appendChild(option);
        }
    }
}



// ==========================================
// MODE SWITCH
// ==========================================
const realtimeSection = document.getElementById("realtimeSection");
modeSelect.addEventListener("change", function () {

    if (this.value === "text") {

        textSection.style.display = "block";
        audioSection.style.display = "none";
        realtimeSection.style.display = "none";
        submitBtn.style.display = "block";

    } else if (this.value === "audio") {

        textSection.style.display = "none";
        audioSection.style.display = "block";
        realtimeSection.style.display = "none";
        submitBtn.style.display = "block";

    } else {

        textSection.style.display = "none";
        audioSection.style.display = "none";
        realtimeSection.style.display = "block";
        submitBtn.style.display = "none";

    }
});

//modeSelect.addEventListener("change", function () {
  //  if (this.value === "text") {
 //       textSection.style.display = "block";
   //     audioSection.style.display = "none";
    //} else {
      //  textSection.style.display = "none";
        //audioSection.style.display = "block";
    //}
   //});

// ==========================================
// SOURCE CHANGE → UPDATE TARGET
// ==========================================

sourceSelect.addEventListener("change", populateTargetLanguages);

// ==========================================
// LOADING STATE
// ==========================================

function setLoading(state) {
    submitBtn.disabled = state;
    submitBtn.innerText = state ? "Processing..." : "Translate";
}

// ==========================================
// RESET UI
// ==========================================

function resetUI() {
    translatedText.innerText = "";
    audioContainer.innerHTML = "";
    resultSection.style.display = "none";
}

// ==========================================
// FORM SUBMIT
// ==========================================
form.addEventListener("submit", async function(e) {

    if(modeSelect.value === "realtime"){
        e.preventDefault();
        alert("Use Start Recording for realtime translation.");
        return;
    }

    e.preventDefault();
//form.addEventListener("submit", async function(e) {
   // e.preventDefault();

    resetUI();
    setLoading(true);

    const formData = new FormData(form);

    try {

       const response = await fetch("/api/process/", {
            method: "POST",
            body: formData,
            credentials: "same-origin",
            headers: {
                "X-CSRFToken": getCSRFToken()
    }
});
       

        if (!response.ok) throw new Error("Server error");

        const data = await response.json();

        resultSection.style.display = "block";
        translatedText.innerText = data.translated_text || "No result received.";

        if (data.audio_url) {
            const audio = document.createElement("audio");
            audio.controls = true;
            audio.src = data.audio_url + "?t=" + Date.now();
            audioContainer.appendChild(audio);
        }

    } catch (error) {
        alert("Processing failed. Please try again.");
    }

    setLoading(false);
});

// ==========================================
// INITIAL CALL ON PAGE LOAD
// ==========================================

window.onload = populateTargetLanguages;


//now real time speech is here

let mediaRecorder;
let isRecording = false;

const startBtn = document.getElementById("startMic");
const stopBtn = document.getElementById("stopMic");
const liveStatus = document.getElementById("liveStatus");

startBtn.onclick = async () => {

    if(isRecording){
        alert("Recording already running");
        return;
    }

    resetUI();
    resultSection.style.display = "block";

    try {

        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

        mediaRecorder = new MediaRecorder(stream);

    } catch(err){

        alert("Microphone permission denied.");
        return;

    }

    mediaRecorder.start(7000);

    isRecording = true;

    liveStatus.innerText = "Listening...";

    mediaRecorder.ondataavailable = async function(event){

        if (!isRecording) return;

        const blob = event.data;

        const formData = new FormData();

        formData.append("audio", blob);
        formData.append("source_lang", sourceSelect.value);
        formData.append("target_lang", targetSelect.value);

        const response = await fetch("/api/realtime-process/", {

            method: "POST",
            body: formData,
            credentials: "same-origin",
            headers: {
                "X-CSRFToken": getCSRFToken()
            }

        });

        const data = await response.json();

        translatedText.innerText += " " + (data.translated_text || "");

        if(data.audio_url){

            const audio = new Audio(data.audio_url + "?t=" + Date.now());
            audio.play();

        }

    };

};

stopBtn.onclick = () => {

    isRecording = false;

    if(mediaRecorder){
        mediaRecorder.stop();
    }

    liveStatus.innerText = "Microphone Stopped";

};

</script>


{% endblock %}
