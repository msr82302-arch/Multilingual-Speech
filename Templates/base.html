<!DOCTYPE html>
<html>
<head>
    <title>MultiLingual AI Platform</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>

        *{
            box-sizing:border-box;
            font-family:'Inter', sans-serif;
        }

        body{
            margin:0;
            background:linear-gradient(135deg,#0f172a,#111827);
            color:#e5e7eb;
        }

        /* ========================= */
        /* HEADER */
        /* ========================= */

        header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:20px 40px;
            border-bottom:1px solid rgba(255,255,255,0.05);
            background:rgba(15,23,42,0.8);
            backdrop-filter:blur(10px);
        }

        .logo{
            font-weight:600;
            font-size:18px;
        }

        nav a{
            margin-left:20px;
            color:#e5e7eb;
            text-decoration:none;
            font-size:14px;
        }

        nav a:hover{
            color:#6366f1;
        }

        /* ========================= */
        /* PAGE LAYOUT */
        /* ========================= */

        .container{
            max-width:1000px;
            margin:60px auto;
            padding:0 20px;
        }

        .card{
            background:rgba(30,41,59,0.7);
            border:1px solid rgba(255,255,255,0.05);
            padding:30px;
            border-radius:16px;
            backdrop-filter:blur(12px);
            box-shadow:0 10px 40px rgba(0,0,0,0.4);
            margin-bottom:30px;
        }

        button{
            padding:12px 22px;
            border:none;
            border-radius:10px;
            background:linear-gradient(135deg,#6366f1,#8b5cf6);
            color:white;
            font-weight:500;
            cursor:pointer;
            transition:0.3s ease;
        }

        button:hover{
            transform:translateY(-2px);
            box-shadow:0 6px 20px rgba(99,102,241,0.4);
        }

        input, textarea, select{
            width:100%;
            padding:12px;
            background:#1e293b;
            border:1px solid rgba(255,255,255,0.08);
            border-radius:10px;
            color:#e5e7eb;
            margin-bottom:20px;
        }

        /* ========================= */
        /* HERO SECTION */
        /* ========================= */

        .hero{
            text-align:center;
        }

        .logo-wrapper{
            display:inline-block;
            margin-bottom:40px;
            cursor:pointer;
        }

        .orbit-container{
            position:relative;
            width:280px;
            height:280px;
            margin:auto;
        }

        /* Earth */

        .earth{
            width:200px;
            position:absolute;
            top:40px;
            left:40px;
            animation:earthRotate 40s linear infinite;
        }

        /* Orbit ring */

        .orbit-ring{
            position:absolute;
            width:260px;
            height:260px;
            border:2px solid rgba(0,255,255,0.4);
            border-radius:50%;
            top:10px;
            left:10px;
            animation:ringRotate 20s linear infinite;
        }

        /* Orbit text */

        .orbit-text{
            position:absolute;
            width:260px;
            height:260px;
            top:10px;
            left:10px;
            display:flex;
            justify-content:center;
            align-items:flex-start;
            font-size:14px;
            letter-spacing:4px;
            color:#67e8f9;
            animation:textOrbit 12s linear infinite;
        }

        /* ========================= */
        /* ANIMATIONS */
        /* ========================= */

        @keyframes earthRotate{
            from{
                transform:rotate(0deg);
            }
            to{
                transform:rotate(360deg);
            }
        }

        @keyframes ringRotate{
            from{
                transform:rotate(0deg);
            }
            to{
                transform:rotate(-360deg);
            }
        }

        @keyframes textOrbit{
            from{
                transform:rotate(0deg);
            }
            to{
                transform:rotate(360deg);
            }
        }

        /* ========================= */
/* DASHBOARD LOGO */
/* ========================= */

        .dashboard-logo{
            text-align:center;
            margin-bottom:25px;
        }

        .dashboard-logo img{
            width:120px;
            height:auto;
            animation:earthRotate 25s linear infinite;
            filter:drop-shadow(0 0 15px rgba(0,255,255,0.4));
        }

    </style>

</head>

<body>

<header>

    <div class="logo">🌍 MultiLingual AI</div>

    <nav>

        <a href="{% url 'home' %}">Home</a>

        {% if request.user.is_authenticated %}
            <a href="{% url 'dashboard' %}">Dashboard</a>
            <a href="{% url 'logout' %}">Logout</a>
        {% else %}
            <a href="{% url 'login' %}">Login</a>
            <a href="{% url 'signup' %}">Signup</a>
        {% endif %}

    </nav>
    
          
</header>

<div class="container">

    {% block content %}{% endblock %}

</div>

</body>
</html>
